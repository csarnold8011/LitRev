<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Szakirodalom-feldolgozó</title>
<style>
:root{
  --bg:#f5f6f4;--panel:#ffffff;--ink:#1c2420;--muted:#5f6b66;--line:#dde3df;--line2:#c9d2cd;
  --accent:#1f6b55;--accent-ink:#ffffff;--accent-soft:#e2f0ea;--accent-line:#a9d2c1;
  --b:#3d5a9e;--b-soft:#e6ecf8;
  --warn:#8a5a00;--warn-soft:#fff3dc;--err:#b3261e;--err-soft:#fdeceb;
  --help:#f3f7f5;--helpline:#c7ddd3;--chip:#eef1ef;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 2px 8px rgba(20,30,25,.06);
  --r:10px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614;--panel:#1a201d;--ink:#e4ebe7;--muted:#9aa7a1;--line:#2b3430;--line2:#3a4540;
  --accent:#5cc29f;--accent-ink:#0b1d16;--accent-soft:#1c3a30;--accent-line:#2f6b56;
  --b:#8fa9e6;--b-soft:#1f2a42;
  --warn:#f0b35a;--warn-soft:#3a2c14;--err:#f28b82;--err-soft:#3b1d1b;
  --help:#18241f;--helpline:#2e4a3e;--chip:#232b27;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{line-height:1.25;margin:0}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.toprow{display:flex;align-items:center;gap:10px;padding:12px 0 8px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:18px;font-weight:650;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);white-space:nowrap;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--accent)}.pill.err .dot{background:var(--err)}
.pill.loading .dot{animation:pulse 1s infinite ease-in-out}
@keyframes pulse{50%{opacity:.25}}
.who{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3}
.who b{color:var(--ink);font-weight:550}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.tab.back{padding-left:4px}
.tabsep{width:1px;background:var(--line);margin:8px 6px}
main{padding:22px 0 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--panel);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--chip)}
.btn.danger{color:var(--err)}
.btn.danger:hover{border-color:var(--err)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.mini{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.mini:hover{color:var(--ink);border-color:var(--line2)}
.langbtn{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.langbtn:hover{color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);margin-bottom:16px;border:1px solid transparent}
.banner.info{background:var(--accent-soft);border-color:var(--accent-line)}
.banner.warn{background:var(--warn-soft)}
.banner.err{background:var(--err-soft)}
.banner p{margin:0;flex:1;min-width:200px}
.banner .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:2px}
.banner .cm{white-space:pre-wrap}
input[type=text],input[type=email],input[type=password],input[type=search],textarea{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:76px}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[readonly]{background:var(--bg)}
.note{font-size:13px;color:var(--muted);margin-top:4px}
.note.err{color:var(--err)}

/* belépés */
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login{max-width:460px;width:100%;padding:26px 28px 24px;position:relative}
.login .langbtn{position:absolute;top:16px;right:16px}
.login h1{font-size:22px;margin-bottom:4px;padding-right:70px}
.login .sub{margin:0 0 18px;color:var(--muted);font-size:14px}
.frm{display:flex;flex-direction:column;gap:14px}
.frm label{font-weight:600;font-size:14px;display:block;margin-bottom:5px}
.frm .btn.primary{padding:10px 14px}
.login .foot{margin:18px 0 0;font-size:13px;color:var(--muted)}
.login .seg{width:100%;margin-bottom:18px}
.login .seg button{flex:1}
.invbox{background:var(--help);border:1px solid var(--helpline);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.invbox p{margin:0}.invbox p+p{margin-top:6px}

/* témák */
.headrow{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.headrow .intro{flex:1;min-width:260px}
.intro h2{font-size:22px;margin-bottom:6px}
.intro p{margin:0;color:var(--muted);max-width:760px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.tcard h3{font-size:17px}
.tcard .ds{color:var(--muted);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tcard .ln{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;background:var(--chip);color:var(--muted)}
.badge.lvl{background:var(--accent-soft);color:var(--accent)}
.badge.closed{background:var(--warn-soft);color:var(--warn)}
.badge.role{background:var(--b-soft);color:var(--b)}
.badge.st-draft{background:var(--chip);color:var(--muted)}
.badge.st-sub{background:var(--b-soft);color:var(--b)}
.badge.st-rev{background:var(--warn-soft);color:var(--warn)}
.badge.st-acc{background:var(--accent-soft);color:var(--accent)}
.badge.hot{background:var(--warn-soft);color:var(--warn)}
.hint{margin-top:18px;padding:14px 16px;background:var(--help);border:1px solid var(--helpline);border-radius:var(--r);font-size:14px}
.hint ol{margin:6px 0 0;padding-left:20px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* űrlap */
.formbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.formbar .ttl{flex:1;min-width:200px}
.formbar .ttl .eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:8px;align-items:center}
.formbar .ttl .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:560px}
.savestate{font-size:12.5px;color:var(--muted)}
.savestate.dirty{color:var(--warn)}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.fgrid{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
.steps{position:sticky;top:110px;display:flex;flex-direction:column;gap:4px}
.step{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer;width:100%}
.step:hover{background:var(--panel);border-color:var(--line)}
.step.on{background:var(--panel);border-color:var(--line2);box-shadow:var(--shadow)}
.step .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;background:var(--chip);color:var(--muted)}
.step.on .num{background:var(--accent);color:var(--accent-ink)}
.step.done .num{background:var(--accent-soft);color:var(--accent)}
.step .st{display:flex;flex-direction:column;min-width:0}
.step b{font-weight:550;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step small{font-size:12px;color:var(--muted)}
.blockhead{margin-bottom:6px}
.blockhead .eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.blockhead h2{font-size:21px;margin-bottom:4px}
.blockhead p{margin:0;color:var(--muted)}
.field{padding:16px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.flabel{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.flabel label{font-weight:600}
.req{color:var(--err);font-weight:600}
.hbtn{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.hbtn:hover,.hbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cattag{font-size:11.5px;color:var(--muted);border:1px dashed var(--line2);padding:0 6px;border-radius:5px}
.nkbtn{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;padding:2px 4px;border-radius:5px;text-decoration:underline dotted;text-underline-offset:3px}
.nkbtn:hover{color:var(--ink);background:var(--chip)}
.help{background:var(--help);border:1px solid var(--helpline);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;margin-bottom:9px;font-size:14px}
.help p{margin:0}
.help p+p{margin-top:6px}
.help .ex{color:var(--muted)}
.doirow{display:flex;gap:8px;flex-wrap:wrap}
.doirow input{flex:1 1 220px;width:auto}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{display:inline-flex;align-items:baseline;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;text-align:left;max-width:100%;font-size:14px}
.opt:hover{border-color:var(--accent)}
.opt .desc{font-size:12.5px;color:var(--muted)}
.opt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:550}
.opt.on .desc{color:var(--ink);font-weight:400}
.tagsugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.sc{width:44px;height:40px;border:1px solid var(--line2);background:var(--panel);border-radius:8px;cursor:pointer;font-weight:600}
.sc.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scalelegend{font-size:12.5px;color:var(--muted);margin-top:5px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.navrow .r{display:flex;gap:8px;flex-wrap:wrap}

/* lista */
.listbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.listbar input[type=search]{flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);padding:8px 12px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.stats{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;text-align:left;width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer}
.rec:hover{border-color:var(--accent)}
.rec .rt{font-weight:550;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rec .rm{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
.rec .rc{grid-column:2/4;display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;background:var(--chip);border-radius:5px;padding:1px 7px;color:var(--muted)}
.chip.cm{background:var(--warn-soft);color:var(--warn)}

/* modális ablakok */
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:30px 16px;overflow:auto}
.modal{background:var(--panel);border-radius:12px;max-width:820px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.narrow{max-width:560px}
.modal header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.modal header .h{flex:1;min-width:0}
.modal header h2{font-size:17px;margin-top:6px}
.modal .body{padding:6px 20px 20px}
.modal .body.frm{padding-top:18px}
.modal h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px}
.dl{display:grid;grid-template-columns:220px 1fr;border-top:1px solid var(--line)}
.dl>div{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl .k{color:var(--muted);padding-right:12px}
.dl .v{white-space:pre-wrap;word-break:break-word}
.dl .v.none{color:var(--muted);font-style:italic}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
.modal footer .left{margin-right:auto}
.modal.wide{max-width:1040px}
.modal.wide footer{position:sticky;bottom:0;background:var(--panel);border-radius:0 0 12px 12px;box-shadow:0 -4px 12px rgba(0,0,0,.06)}
.review{margin-top:16px;padding:14px 16px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r)}
.review h3{margin:0 0 10px}
.review textarea{margin-top:10px;background:var(--panel)}
.review .rr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.invitem{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:10px}
.invitem .em{font-weight:600}
.invitem .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.invitem .row input{flex:1 1 260px;width:auto;font-size:13px}

/* téma és hallgatók */
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:start}
.mgrid h3{font-size:16px;margin-bottom:8px}
.kv{font-size:14px;margin:6px 0}
.kv .k{color:var(--muted)}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
.mtable td.act{text-align:right;white-space:nowrap}
.mtable .sub{font-size:12.5px;color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow input{flex:1 1 240px;width:auto}

/* letöltés */
.exrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 0}
.exlbl{font-weight:600;font-size:14px;min-width:80px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.exblk{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.exblk .bh{font-weight:600;font-size:14px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:3px 0;cursor:pointer;line-height:1.35}
.ck input{accent-color:var(--accent);width:15px;height:15px;margin:1px 0 0;flex:none}
.exsum{margin-right:auto;font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.err{background:var(--err);color:#fff}
[hidden]{display:none!important}

@media (max-width:860px){
  .fgrid,.mgrid{grid-template-columns:1fr}
  .steps{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .step{flex:none;width:auto;padding:6px 10px}
  .step .st small{display:none}
  .dl{grid-template-columns:1fr}
  .dl .k{border-bottom:0!important;padding-bottom:0}
  .rec{grid-template-columns:1fr}
  .rec .rc{grid-column:1}
  .rec .rm{text-align:left}
  .who{display:none}
  .brand{flex-basis:100%}
  .toprow{gap:6px}
  .toprow .pill{margin-right:auto}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
'use strict';
const CFG = window.SZ_CONFIG || {};
const API = String(CFG.apiUrl || '').trim();

/* ================= Szövegek / Texts ================= */
const I18N = {
hu:{
  app:'Szakirodalom-feldolgozó', other:'English', otherShort:'EN',

  'lg.email':'E-mail cím', 'lg.pw':'Jelszó', 'lg.pw2':'Jelszó még egyszer', 'lg.name':'Teljes név', 'lg.code':'Témavezetői regisztrációs kód',
  'lg.codeNote':'A kódot az oldal adminisztrátorától kapod.', 'lg.pwNote':'Legalább 8 karakter.',
  'lg.login':'Belépés', 'lg.register':'Regisztráció', 'lg.busy':'Folyamatban…',

  'lg.fillAll':'Tölts ki minden mezőt.', 'lg.pwMismatch':'A két jelszó nem egyezik.', 'lg.pwShort':'A jelszó legalább 8 karakter legyen.',
  'lg.loggedOut':'{m} A nem mentett munkád piszkozatként megmaradt ezen a gépen.',
  'inv.title':'Regisztráció meghívóval', 'inv.resetTitle':'Új jelszó beállítása', 'inv.checking':'A link ellenőrzése…',

function errText(code, serverMsg){
  if (S.lang === 'hu' && serverMsg) return serverMsg;

function mkErr(code, serverMsg, auth){ const e = new Error(errText(code, serverMsg)); e.code = code; e.auth = !!auth; return e; }
async function api(action, data){
  const body = Object.assign({action, token:S.token}, data || {});
  let r, j;
  try{
    r = await fetch(API, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  }catch(e){ throw mkErr('NET'); }
  try{ j = await r.json(); }catch(e){ throw mkErr('BADRESP'); }
  if (!j.ok){
    if (j.code === 'AUTH' && S.token){ const err = mkErr('AUTH', j.error, true); logout(err.message); throw err; }
    throw mkErr(j.code, j.error);
  }
  return j;
}

let firstSync = false;
async function sync(quiet){
  S.status = 'loading'; renderHeader();
  try{
    const j = await api('getAll');
    S.user = j.user || S.user; S.topics = j.topics || []; S.records = j.records || []; S.loaded = true;
    S.status = 'ok'; S.statusMsg = ''; S.lastSync = nowStr().slice(11);
    const auth = store.get('sz_auth', null); if (auth){ auth.user = S.user; store.set('sz_auth', auth); }
    if (S.topicId && !curTopic()){ S.topicId = ''; S.view = 'home'; S.current = null; }
    if (firstSync){
      firstSync = false;
      const last = store.get('sz_topic_' + S.user.email, '');
      if (last && S.topics.some(x => x.id === last)) openTopic(last, true);
      else if (S.user.szerep !== 'tv' && S.topics.length === 1) openTopic(S.topics[0].id, true);
    }
    if (S.view === 'form' && !canWriteView()) S.view = 'list';
    if (!quiet) toast(t('sync.ok'));
  }catch(e){
    if (e.auth) return;
    S.status = 'err'; S.statusMsg = e.message;
    if (!quiet) toast(t('sync.fail', {m:e.message}), true);
  }
  renderHeader();
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#block,.modal');
  if (!typing){ renderView(); renderDetail(); renderModal(); }
}

/* ---- DOI (Crossref) ---- */
function cleanDoi(s){ return String(s || '').trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, '').replace(/^doi:\s*/i, '').trim(); }
function stripTags(s){ return String(s || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim(); }
function apaAuthors(list){
  const a = (list || []).filter(x => x.family || x.name).map(x => {
    if (!x.family) return x.name;
    const ini = String(x.given || '').split(/\s+/).filter(Boolean)
      .map(g => g.split('-').map(p => p.replace(/\./g, '').charAt(0).toUpperCase() + '.').join('-')).join(' ');
    return x.family + (ini ? ', ' + ini : '');
  });
  if (!a.length) return '';
  if (a.length === 1) return a[0];
  if (a.length <= 20) return a.slice(0, -1).join(', ') + ', & ' + a[a.length - 1];
  return a.slice(0, 19).join(', ') + ', … ' + a[a.length - 1];
}
function crossrefToFields(m, doi){
  const dp = (m.issued || m['published-print'] || m['published-online'] || {})['date-parts'];
  const year = dp && dp[0] && dp[0][0] ? String(dp[0][0]) : '';
  const title = stripTags((m.title || [])[0]);
  const journal = stripTags((m['container-title'] || [])[0]) || stripTags(m.publisher);
  const authors = apaAuthors(m.author || m.editor);
  let ref = authors ? authors + ' ' : '';
  ref += '(' + (year || 'n.d.') + '). ';
  if (title) ref += title + (/[.?!]$/.test(title) ? ' ' : '. ');
  const cont = stripTags((m['container-title'] || [])[0]);
  if (cont){
    ref += cont;
    if (m.volume) ref += ', ' + m.volume + (m.issue ? '(' + m.issue + ')' : '');
    if (m.page) ref += ', ' + String(m.page).replace(/-/g, '–');
    else if (m['article-number']) ref += ', ' + m['article-number'];
    ref += '. ';
  } else if (m.publisher) ref += stripTags(m.publisher) + '. ';
  ref += 'https://doi.org/' + doi;
  return {'Hivatkozás':ref.trim(), 'Év':year, 'Megjelenés helye':journal};
}
async function doiLookup(btn){
  const doi = cleanDoi(S.current.fields['DOI']);
  if (!/^10\.\d{4,9}\/\S+$/.test(doi)){ toast(t('f.doiBad'), true); return; }
  btn.disabled = true; const old = btn.textContent; btn.textContent = t('f.doiBusy');
  try{
    const r = await fetch('https://api.crossref.org/works/' + encodeURIComponent(doi));
    if (r.status === 404){ toast(t('f.doi404'), true); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const m = (await r.json()).message || {};
    const got = crossrefToFields(m, doi);
    S.current.fields['DOI'] = doi;
    const done = [], kept = [];
    for (const [k, v] of Object.entries(got)){
      if (!v) continue;
      if (filled(S.current.fields[k])) kept.push(fLabel(k)); else { S.current.fields[k] = v; done.push(fLabel(k)); }
    }
    const typ = (m.type || '').toLowerCase();
    if (!filled(S.current.fields['Forrás típusa']) && /book/.test(typ)){ S.current.fields['Forrás típusa'] = 'konyv'; done.push(fLabel('Forrás típusa')); }
    markDirty(); renderView();
    if (done.length) toast(t('f.doiDone', {f:done.join(', ')}) + (kept.length ? t('f.doiKept', {f:kept.join(', ')}) : t('f.doiCheck')));
    else toast(t('f.doiNone'));
  }catch(e){
    toast(t('f.doiFail', {m:e.message}), true);
  }finally{
    btn.disabled = false; btn.textContent = old;
  }
}

function renderSteps(){
  const c = S.current;
  return TPL.map((b, i) => {
    const n = b.f.length, m = b.f.filter(f => filled(c.fields[f.k])).length, done = m === n;
    return `<button class="step ${i === c.step ? 'on' : ''} ${done ? 'done' : ''}" data-act="goto" data-i="${i}"><span class="num">${done && i !== c.step ? '✓' : i + 1}</span><span class="st"><b>${esc(L(b)[0])}</b><small>${esc(t('f.filled', {m, n}))}</small></span></button>`;
  }).join('');
}
function progressPct(){ return Math.round(100 * FIELDS.filter(f => filled(S.current.fields[f.k])).length / FIELDS.length); }
function topicTags(){
  const set = new Map();
  topicRecords().forEach(r => splitList(r['Címkék']).forEach(x => { const k = x.toLowerCase(); if (!set.has(k)) set.set(k, x); }));
  return Array.from(set.values()).sort((a, b) => a.localeCompare(b, S.lang));
}
function renderField(f){
  const v = S.current.fields[f.k], k = esc(f.k), [lbl, help, ex] = L(f);
  const open = S.helpAll || S.helpOpen[f.k];
  let input = '';
  if (f.type === 'text') input = `<input type="text" data-k="${k}" value="${esc(v)}" aria-label="${esc(lbl)}">`;
  else if (f.type === 'textarea') input = `<textarea data-k="${k}" rows="3" aria-label="${esc(lbl)}">${esc(v)}</textarea>`;
  else if (f.type === 'doi') input = `<div class="doirow"><input type="text" data-k="${k}" value="${esc(v)}" aria-label="${esc(lbl)}" placeholder="10.xxxx/xxxxx" spellcheck="false"><button type="button" class="btn" data-act="doi">${esc(t('f.doiBtn'))}</button></div>`;
  else if (f.type === 'scale') input = `<div class="scale">${[1,2,3,4,5].map(n => `<button type="button" class="sc ${String(v) === String(n) ? 'on' : ''}" data-act="scale" data-k="${k}" data-n="${n}">${n}</button>`).join('')}</div><div class="scalelegend">${esc(t('f.scaleLegend'))}</div>`;
  else if (f.type === 'choice'){
    const sel = f.single ? (filled(v) ? [String(v)] : []) : splitList(v);
    const list = CHOICES[f.set].map(x => x[0]);
    for (const s of sel) if (!list.includes(s)) list.push(s);
    input = `<div class="opts">${list.map(id => { const d = choiceDesc(f.set, id); return `<button type="button" class="opt ${sel.includes(id) ? 'on' : ''}" data-act="opt" data-k="${k}" data-code="${esc(id)}" aria-pressed="${sel.includes(id)}">${esc(choiceLabel(f.set, id))}${d ? `<span class="desc">${esc(d)}</span>` : ''}</button>`; }).join('')}</div>`;
  }
  else if (f.type === 'tags'){
    const have = splitList(v).map(x => x.toLowerCase());
    const sugg = topicTags().filter(x => !have.includes(x.toLowerCase())).slice(0, 30);
    input = `<input type="text" data-k="${k}" value="${esc(v)}" aria-label="${esc(lbl)}">${sugg.length ? `<div class="tagsugg">${esc(t('f.tagSugg'))} ${sugg.map(x => `<button type="button" class="mini" data-act="tag-add" data-k="${k}" data-tag="${esc(x)}">+ ${esc(x)}</button>`).join('')}</div>` : ''}`;
  }
  const nk = f.nk && (f.type === 'text' || f.type === 'textarea');
  return `<div class="field" data-field="${k}">
    <div class="flabel"><label>${esc(lbl)}${f.req ? ' <span class="req">*</span>' : ''}</label>
      <button type="button" class="hbtn ${open ? 'on' : ''}" data-act="help" data-k="${k}" aria-label="${esc(t('f.help'))}: ${esc(lbl)}" title="${esc(t('f.help'))}">?</button>
      ${f.type === 'choice' ? `<span class="cattag">${esc(t(f.single ? 'f.single' : 'f.multi'))}</span>` : ''}
      ${nk ? `<button type="button" class="nkbtn" data-act="nk" data-k="${k}" title="${esc(t('f.nkTip'))}">${esc(t('f.nk'))}</button>` : ''}
    </div>
    <div class="help" ${open ? '' : 'hidden'}><p>${esc(help)}</p>${ex ? `<p class="ex"><b>${esc(t('f.example'))}</b> ${esc(ex)}</p>` : ''}</div>
    ${input}
  </div>`;
}
function fieldEl(k){ return $$('[data-field]').find(e => e.dataset.field === k); }
function rerenderField(k){
  const el = fieldEl(k), f = fieldDef(k); if (!el || !f) return;
  const tmp = document.createElement('div'); tmp.innerHTML = renderField(f);
  el.replaceWith(tmp.firstElementChild);
}
function updateFormMeta(){
  if (S.view !== 'form' || !S.current) return;

}
function gotoField(k){
  const i = TPL.findIndex(b => b.f.some(f => f.k === k));

}

  if (S.fStatus !== 'all') rows = rows.filter(r => (r['Állapot'] || 'piszkozat') === S.fStatus);

function fmtValue(k, v){

async function saveReview(btn){

function mailtoLink(it, cim){
  const vars = {t:cim, e:it.email, d:dateStr(it.lejar), l:inviteUrl(it.token), u:siteUrl(), n:S.user.nev};
  const fill = (lang, k) => I18N[lang][k].replace(/\{(\w+)\}/g, (m, x) => vars[x] == null ? m : vars[x]);
  const k = it.reset ? 'mail.reset' : 'mail.invite';
  const first = S.lang, second = S.lang === 'hu' ? 'en' : 'hu';
  const body = fill(first, k) + '\n\n----------\n\n' + fill(second, k);
  const subj = I18N.hu[it.reset ? 'mail.subjReset' : 'mail.subjInvite'];
  return `mailto:${encodeURIComponent(it.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
}

        <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-act="close-modal">${esc(t('t.cancel'))}</button><button type="submit" class="btn primary" id="tpBtn">${esc(t(tp ? 't.save' : 't.create'))}</button></div>
      </form></div>`;
  } else if (m.kind === 'invites'){
    const items = m.items.map(it => {
      if (it.token) return `<div class="invitem"><div class="em">${esc(it.email)}</div>
        <div class="note">${it.reset ? esc(t('iv.resetNote')) + ' ' : ''}${esc(t('iv.until', {d:dateStr(it.lejar)}))}</div>
        <div class="row"><input type="text" readonly value="${esc(inviteUrl(it.token))}" data-act="sel"><button class="btn sm" data-act="iv-copy" data-link="${esc(inviteUrl(it.token))}">${esc(t('iv.copy'))}</button><a class="btn sm primary" href="${esc(mailtoLink(it, m.cim))}">${esc(t('iv.mail'))}</a></div></div>`;
      return `<div class="invitem"><div class="em">${esc(it.email)}</div><div class="note">${esc(t(it.mar ? 'iv.member' : 'iv.already'))}</div></div>`;
    }).join('');
    html = `<div class="modal narrow" role="dialog" aria-modal="true">
      <header><div class="h"><h2 style="margin-top:0">${esc(t('iv.title'))}</h2><div class="muted" style="font-size:13.5px;margin-top:4px">${esc(m.cim)}</div></div><button class="btn ghost sm" data-act="close-modal">${esc(t('d.close'))}</button></header>
      <div class="body">${items}<p class="note" style="margin-top:14px">${esc(t('iv.note'))}</p></div>
      <footer><button class="btn primary" data-act="close-modal">${esc(t('d.close'))}</button></footer></div>`;
  } else if (m.kind === 'account'){
    html = `<div class="modal narrow" role="dialog" aria-modal="true">
      <header><div class="h"><h2 style="margin-top:0">${esc(t('ac.title'))}</h2><div class="muted" style="font-size:13.5px;margin-top:4px">${esc(t('ac.email', {e:S.user.email}))} · ${esc(t('ac.role', {r:t(S.user.szerep === 'tv' ? 'role.tv' : 'role.h')}))}</div></div><button class="btn ghost sm" data-act="close-modal">${esc(t('d.close'))}</button></header>
      <div class="body">
        <form id="nameForm" class="frm" style="margin-top:16px"><div><label for="acName">${esc(t('ac.name'))}</label><input type="text" id="acName" value="${esc(S.user.nev)}" autocomplete="name"></div>
          <div><button type="submit" class="btn">${esc(t('ac.saveName'))}</button></div></form>
        <h3>${esc(t('ac.pwTitle'))}</h3>
        <form id="pwForm" class="frm"><input type="email" autocomplete="username" value="${esc(S.user.email)}" hidden>
          <div><label for="acOld">${esc(t('ac.oldPw'))}</label><input type="password" id="acOld" autocomplete="current-password"></div>
          <div><label for="acNew">${esc(t('ac.newPw'))}</label><input type="password" id="acNew" autocomplete="new-password"><div class="note">${esc(t('lg.pwNote'))}</div></div>
          <div><label for="acNew2">${esc(t('ac.newPw2'))}</label><input type="password" id="acNew2" autocomplete="new-password"></div>
          <div><button type="submit" class="btn primary">${esc(t('ac.savePw'))}</button></div>
          <div class="note err" id="acMsg" role="alert"></div></form>
      </div></div>`;
  }
  ov.innerHTML = html;
}
async function submitTopic(){
  const m = S.modal, msg = $('#tpMsg'), btn = $('#tpBtn');
  const cim = $('#tpCim').value.trim(), leiras = $('#tpLeiras').value.trim();
  const tp = m.id ? S.topics.find(x => x.id === m.id) : null;
  const kepzes = m.kepzes || (tp ? tp.kepzes : 'BSc');
  if (!cim){ msg.textContent = t('t.needTitle'); return; }
  btn.disabled = true; msg.textContent = '';
  try{
    if (tp){
      await api('topicSave', {tema:{id:tp.id, cim, leiras, kepzes}});
      S.modal = null; renderModal(); toast(t('t.saved')); await sync(true);
    } else {
      const j = await api('topicSave', {tema:{cim, leiras, kepzes}, hallgatok:$('#tpStud').value});
      await sync(true);
      openTopic(j.tema.id, true); S.view = 'members'; renderHeader(); renderView();
      const items = (j.meghivok || []).map(x => ({email:x.email, token:x.token, lejar:x.lejar, mar:x.mar, regisztralt:x.regisztralt}));
      S.modal = items.length ? {kind:'invites', cim, items} : null;
      renderModal(); toast(t('t.created'));
    }
  }catch(e){ if (!e.auth){ msg.textContent = e.message; btn.disabled = false; } }
}
async function submitName(){
  const nev = $('#acName').value.trim(); if (!nev) return;
  try{
    const j = await api('profile', {nev});
    S.user = j.user; const auth = store.get('sz_auth', null); if (auth){ auth.user = j.user; store.set('sz_auth', auth); }
    toast(t('ac.nameSaved')); renderHeader();
  }catch(e){ if (!e.auth) toast(e.message, true); }
}
async function submitPw(){
  const regi = $('#acOld').value, uj = $('#acNew').value, uj2 = $('#acNew2').value, msg = $('#acMsg');
  if (!regi || !uj || !uj2){ msg.textContent = t('lg.fillAll'); return; }
  if (uj.length < 8){ msg.textContent = t('lg.pwShort'); return; }
  if (uj !== uj2){ msg.textContent = t('lg.pwMismatch'); return; }
  msg.textContent = '';
  try{
    const j = await api('changePassword', {regi, uj});
    const auth = saveAuth(j); S.token = auth.token; S.lejar = auth.lejar;
    S.modal = null; renderModal(); toast(t('ac.pwSaved'));
  }catch(e){ if (!e.auth) msg.textContent = e.message; }
}

/* ================= Letöltés táblázatként ================= */
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function exportGroups(){
  return TPL.map(b => ({t:L(b)[0], f:b.f.map(f => f.k)})).concat([{t:t('ex.admin'), f:META_COLS}]);
}
function openExport(){ S.export = {scope:'all', cols:new Set(store.get('sz_export_cols', MATRIX))}; renderExport(); }
function exportCols(){ return exportGroups().flatMap(g => g.f).filter(k => S.export.cols.has(k)); }
function exportRows(){
  const rows = S.export.scope === 'view' ? listRows() : topicRecords().slice();
  return rows.sort((a, b) => String(a['Hivatkozás'] || '').localeCompare(String(b['Hivatkozás'] || ''), S.lang));
}
function renderExport(){
  let ov = $('#exportOv');
  if (!S.export || !S.token){ S.export = null; if (ov) ov.remove(); return; }
  const e = S.export, filtering = !!(S.q.trim() || S.fStatus !== 'all');
  if (e.scope === 'view' && !filtering) e.scope = 'all';
  const cols = exportCols(), rows = exportRows();
  if (!ov){ ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'exportOv'; ov.dataset.act = 'close-export'; document.body.appendChild(ov); }
  const sc = ov.scrollTop;
  ov.innerHTML = `<div class="modal wide" role="dialog" aria-modal="true" aria-label="${esc(t('ex.title'))}">
    <header><div class="h"><h2 style="margin-top:0">${esc(t('ex.title'))}</h2><div class="muted" style="font-size:13.5px;margin-top:4px">${esc(t('ex.sub'))}</div></div>
      <button class="btn ghost sm" data-act="close-export">${esc(t('d.close'))}</button></header>
    <div class="body">
      ${filtering ? `<div class="exrow"><span class="exlbl">${esc(t('ex.rows'))}</span><div class="seg"><button class="${e.scope === 'all' ? 'on' : ''}" data-act="ex-scope" data-s="all">${esc(t('ex.all', {n:topicRecords().length}))}</button><button class="${e.scope === 'view' ? 'on' : ''}" data-act="ex-scope" data-s="view">${esc(t('ex.view', {n:listRows().length}))}</button></div></div>` : ''}
      <div class="exrow"><span class="exlbl">${esc(t('ex.cols'))}</span><div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="mini" data-act="ex-preset" data-p="matrix" title="${esc(t('ex.matrixTip'))}">${esc(t('ex.matrix'))}</button>
        <button class="mini" data-act="ex-preset" data-p="all">${esc(t('ex.allCols'))}</button>
        <button class="mini" data-act="ex-preset" data-p="none">${esc(t('ex.none'))}</button></div></div>
      <div class="exgrid">${exportGroups().map((g, gi) => {
        const on = g.f.filter(k => e.cols.has(k)).length;
        return `<div class="exblk"><label class="ck bh"><input type="checkbox" data-exblk="${gi}" ${on === g.f.length ? 'checked' : ''} ${on && on < g.f.length ? 'data-ind="1"' : ''}>${esc(g.t)}</label>
          ${g.f.map(k => `<label class="ck"><input type="checkbox" data-excol="${esc(k)}" ${e.cols.has(k) ? 'checked' : ''}>${esc(fLabel(k))}</label>`).join('')}</div>`;
      }).join('')}</div>
    </div>
    <footer><span class="exsum">${esc(t('ex.sum', {r:rows.length, c:cols.length}))}</span>
      <button class="btn" data-act="ex-go" data-fmt="csv" ${rows.length && cols.length ? '' : 'disabled'}>CSV</button>
      <button class="btn primary" data-act="ex-go" data-fmt="xlsx" ${rows.length && cols.length ? '' : 'disabled'}>${esc(t('ex.excel'))}</button></footer>
  </div>`;
  $$('[data-ind]', ov).forEach(c => { c.indeterminate = true; });
  ov.scrollTop = sc;
}
function cellVal(k, v){
  if (v == null) return '';
  const s = fmtValue(k, v);
  if ((k === 'Év' || k === 'Megbízhatóság (1-5)') && /^\d+$/.test(s.trim())) return Number(s.trim());
  return s;
}
function colWidth(k){
  if (k === 'Hivatkozás') return 60;
  const f = fieldDef(k);
  if (!f) return k === 'Témavezetői megjegyzés' ? 45 : 17;
  if (f.type === 'textarea') return 45;
  if (f.type === 'choice' || f.type === 'tags') return 24;
  if (f.type === 'scale' || k === 'Év') return 12;
  return 24;
}
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = XLSX_URL;
    s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error(t('ex.libFail')));
    s.onerror = () => rej(new Error(t('ex.libFail')));
    document.head.appendChild(s);
  });
}
function fileBase(){
  const tp = curTopic();
  const slug = String(tp ? tp.cim : 'tema').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40);
  return `${S.lang === 'en' ? 'LiteratureReview' : 'Szakirodalom'}_${slug}_${nowStr().slice(0, 10)}`;
}
async function doExport(fmt, btn){
  const cols = exportCols(), rows = exportRows();
  if (!cols.length || !rows.length) return;
  store.set('sz_export_cols', cols);
  const aoa = [cols.map(fLabel)].concat(rows.map(r => cols.map(c => cellVal(c, r[c]))));
  if (fmt === 'csv'){
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const csv = '﻿' + aoa.map(r => r.map(q).join(';')).join('\r\n');
    download(fileBase() + '.csv', new Blob([csv], {type:'text/csv;charset=utf-8'}));
    toast(t('ex.csvDone', {r:rows.length, c:cols.length}));
    return;
  }
  const old = btn.textContent; btn.disabled = true; btn.textContent = t('ex.busy');
  try{
    const X = await loadXLSX();
    const ws = X.utils.aoa_to_sheet(aoa);
    ws['!cols'] = cols.map(c => ({wch:colWidth(c)}));
    ws['!autofilter'] = {ref:X.utils.encode_range({s:{r:0, c:0}, e:{r:aoa.length - 1, c:cols.length - 1}})};
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, t('ex.sheet'));
    X.writeFile(wb, fileBase() + '.xlsx');
    toast(t('ex.done', {r:rows.length, c:cols.length}));
  }catch(err){
    toast(t('ex.fail', {m:err.message}), true);
  }finally{
    btn.disabled = false; btn.textContent = old;
  }
}

/* ================= Események ================= */
function go(step){ S.current.step = step; saveDraft(); renderView(); window.scrollTo(0, 0); }
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, k = el.dataset.k;
  if (el.classList.contains('overlay') && e.target !== el) return;
  switch (act){
    case 'lang': S.lang = S.lang === 'hu' ? 'en' : 'hu'; store.set('sz_lang', S.lang); rerenderAll(); break;
    case 'lg-tab': S.loginTab = el.dataset.tab; S.loginMsg = ''; renderLogin(); break;
    case 'to-login':
      if (el.dataset.email) store.set('sz_email', el.dataset.email);
      S.invite = null; try{ history.replaceState(null, '', location.pathname + location.search); }catch(x){}
      S.loginTab = 'login'; renderLogin(); break;
    case 'tab': S.view = el.dataset.view; S.detail = null; if (S.view === 'home') S.topicId = S.topicId; renderHeader(); renderView(); renderDetail(); window.scrollTo(0, 0); break;
    case 'sync': sync(false); break;
    case 'logout': logout(''); break;
    case 'account': S.modal = {kind:'account'}; renderModal(); break;
    case 'open-topic': openTopic(el.dataset.id); break;
    case 'topic-new': S.modal = {kind:'topic'}; renderModal(); setTimeout(() => { const f = $('#tpCim'); if (f) f.focus(); }, 0); break;
    case 'topic-edit': S.modal = {kind:'topic', id:S.topicId}; renderModal(); break;
    case 'topic-toggle': topicToggle(); break;
    case 'tp-lvl': S.modal.kepzes = el.dataset.l; $$('[data-act="tp-lvl"]').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'close-modal': S.modal = null; renderModal(); break;
    case 'iv-copy': toast(await copyText(el.dataset.link) ? t('iv.copied') : el.dataset.link); break;
    case 'sel': el.select(); break;
    case 'm-link': memberLink(el.dataset.email, el); break;
    case 'm-remove': memberRemove(el.dataset.email); break;
    case 'new-record':
      if (S.dirty && !confirm(t('f.confirmNew'))) return;
      S.current = newCurrent(); setDirty(false); saveDraft(); S.helpOpen = {}; renderView(); window.scrollTo(0, 0); break;
    case 'goto': go(+el.dataset.i); break;
    case 'next': go(S.current.step + 1); break;
    case 'prev': go(S.current.step - 1); break;
    case 'help': {
      if (S.helpAll) return;
      S.helpOpen[k] = !S.helpOpen[k];
      const fe = fieldEl(k); if (fe){ $('.help', fe).hidden = !S.helpOpen[k]; el.classList.toggle('on', !!S.helpOpen[k]); }
      break;
    }
    case 'helpall': S.helpAll = el.checked; store.set('sz_helpall', S.helpAll); renderView(); break;
    case 'nk': {
      S.current.fields[k] = I18N.hu['f.nkVal'];
      const fe = fieldEl(k), inp = fe && $('input[data-k],textarea[data-k]', fe); if (inp) inp.value = I18N.hu['f.nkVal'];
      markDirty(); break;
    }
    case 'doi': doiLookup(el); break;
    case 'scale': S.current.fields[k] = S.current.fields[k] === el.dataset.n ? '' : el.dataset.n; rerenderField(k); markDirty(); break;
    case 'opt': {
      const f = fieldDef(k), code = el.dataset.code;
      if (f.single) S.current.fields[k] = S.current.fields[k] === code ? '' : code;
      else {
        const arr = splitList(S.current.fields[k]).slice(), i = arr.indexOf(code);
        if (i >= 0) arr.splice(i, 1); else arr.push(code);
        S.current.fields[k] = CHOICES[f.set].map(x => x[0]).filter(x => arr.includes(x)).concat(arr.filter(x => !CHOICES[f.set].some(c => c[0] === x)));
      }
      rerenderField(k); markDirty(); break;
    }
    case 'tag-add': {
      const arr = splitList(S.current.fields[k]); arr.push(el.dataset.tag);
      S.current.fields[k] = arr.join(', '); rerenderField(k); markDirty(); break;
    }
    case 'save': saveCurrent(false); break;
    case 'submit': saveCurrent(true); break;
    case 'fstatus': S.fStatus = el.dataset.f; renderView(); break;
    case 'open-record': S.detail = {id:el.dataset.id}; renderDetail(); break;
    case 'close-detail': S.detail = null; renderDetail(); break;
    case 'rv-st': S.detail.rv = el.dataset.s; $$('[data-act="rv-st"]').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'rv-save': saveReview(el); break;
    case 'del-record': deleteRecord(el.dataset.id); break;
    case 'edit-record': {
      if (S.dirty && S.current && S.current.id !== el.dataset.id && !confirm(t('f.confirmOpen'))) return;
      const r = findRecord(el.dataset.id); if (!r) return;
      S.current = {id:String(r.id), fields:recordToFields(r), step:0, saved:true, savedAt:r['Módosítva'] || ''};
      setDirty(false); saveDraft(); S.detail = null; S.view = 'form'; S.helpOpen = {};
      renderDetail(); renderHeader(); renderView(); window.scrollTo(0, 0); break;
    }
    case 'export': openExport(); break;
    case 'close-export': S.export = null; renderExport(); break;
    case 'ex-scope': S.export.scope = el.dataset.s; renderExport(); break;
    case 'ex-preset': {
      const p = el.dataset.p;
      S.export.cols = new Set(p === 'matrix' ? MATRIX : p === 'all' ? exportGroups().flatMap(g => g.f) : []);
      renderExport(); break;
    }
    case 'ex-go': doExport(el.dataset.fmt, el); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target; if (!S.export) return;
  if (el.dataset.excol){ if (el.checked) S.export.cols.add(el.dataset.excol); else S.export.cols.delete(el.dataset.excol); renderExport(); }
  else if (el.dataset.exblk){
    const g = exportGroups()[+el.dataset.exblk];
    g.f.forEach(k => { if (el.checked) S.export.cols.add(k); else S.export.cols.delete(k); });
    renderExport();
  }
});
document.addEventListener('submit', e => {
  const id = e.target.id;
  const map = {loginForm:doLogin, regForm:doRegister, invForm:doInvite, topicForm:submitTopic, nameForm:submitName, pwForm:submitPw, addMemberForm:memberAdd};
  if (map[id]){ e.preventDefault(); map[id](); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q'){
    S.q = el.value; const pos = el.selectionStart; renderView();
    const q = $('#q'); if (q){ q.focus(); try{ q.setSelectionRange(pos, pos); }catch(x){} }
    return;
  }
  if (el.id === 'rvText' && S.detail){ S.detail.rvText = el.value; return; }
  if (S.current && S.view === 'form' && el.dataset && el.dataset.k && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')){
    S.current.fields[el.dataset.k] = el.value; markDirty();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (S.modal){ S.modal = null; renderModal(); }
    else if (S.export){ S.export = null; renderExport(); }
    else if (S.detail){ S.detail = null; renderDetail(); }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && S.token && S.view === 'form' && S.current){ e.preventDefault(); saveCurrent(false); }
});
window.addEventListener('beforeunload', e => { if (S.dirty && S.token){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', () => {
  const m = /invite=([a-f0-9]+)/i.exec(location.hash);
  if (m && !S.token) startInvite(m[1]);
});

/* ================= Indítás ================= */
(function init(){
  document.documentElement.lang = S.lang;
  const m = /invite=([a-f0-9]+)/i.exec(location.hash);
  if (m){
    if (S.token) logout('');
    store.del('sz_auth');
    startInvite(m[1]);
    return;
  }
  const auth = store.get('sz_auth', null);
  if (API && auth && auth.token && auth.lejar > Date.now() && auth.user) enter(auth);
  else renderLogin();
})();
